<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Komik</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#000;color:#e2e8f0;padding:30px 20px;min-height:100vh}
.container{max-width:780px;margin:auto;background:rgba(30,41,59,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:25px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.1)}
h1{text-align:center;color:#38bdf8;margin-bottom:25px;font-size:24px}
form{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;background:rgba(15,23,42,.6);padding:15px;border-radius:8px;border:1px solid #334155}
input[type=text],input[type=number],input[type=email],input[type=password],select{padding:12px;background:#1e293b;border:1px solid #475569;border-radius:6px;color:white;font-size:14px;outline:none}
input:focus,select:focus{border-color:#38bdf8}
input[type=text]{flex:3;min-width:200px}input[type=number]{width:80px}select{flex:1;min-width:110px;cursor:pointer}
button{cursor:pointer}
.btn-submit{padding:12px 20px;background:#0284c7;color:white;border:0;border-radius:6px;font-weight:bold}
.category-filter{display:flex;gap:8px;margin-bottom:15px;justify-content:center;flex-wrap:wrap}
.btn-filter{padding:8px 16px;background:#334155;border:1px solid #475569;color:#cbd5e1;border-radius:20px;font-weight:600;font-size:13px}
.btn-filter.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
.search-container{margin-bottom:20px}.search-input{width:100%;padding:10px 15px;background:rgba(51,65,85,.8);border:1px solid #475569;border-radius:6px;color:white;font-size:14px}
ul{list-style:none}li.comic-row{background:rgba(51,65,85,.7);padding:15px;margin-bottom:12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid #38bdf8;flex-wrap:wrap;gap:10px}
.comic-info{display:flex;flex-direction:column;gap:8px;max-width:65%;min-width:200px}
.title-wrapper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.comic-title{font-weight:600;color:#f8fafc;font-size:16px}
.btn-copy{background:#334155;border:1px solid #475569;color:#cbd5e1;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:bold}
.comic-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chapter-input-container{display:flex;align-items:center;gap:4px;color:#38bdf8;font-size:14px;font-weight:500}
.input-chapter-inline{width:70px;padding:4px 6px;background:#1e293b;border:1px solid #475569;color:#38bdf8;font-size:14px;border-radius:4px;font-weight:bold;text-align:center}
.select-inline{width:110px;padding:4px 8px;background:#1e293b;border:1px solid #475569;color:#38bdf8;font-size:12px;border-radius:4px;font-weight:bold;text-transform:uppercase;text-align:center}
.update-time{font-size:12px;color:#94a3b8;font-style:italic}
.action-btn{display:flex;gap:6px;align-items:center}.btn-action{border:0;border-radius:6px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.btn-plus,.btn-minus{width:35px;height:32px}.btn-plus{background:#22c55e;color:white;font-size:16px}.btn-minus{background:#eab308;color:#1e293b;font-size:16px}.btn-delete{padding:0 10px;height:32px;background:#ef4444;color:white}
.empty-state{text-align:center;color:#94a3b8;padding:20px 0;font-style:italic}
#loginPanel{max-width:430px;margin:8vh auto;background:#1e293b;padding:25px;border:1px solid #475569;border-radius:12px}
#loginPanel h2{text-align:center;color:#38bdf8;margin-bottom:18px}
#loginForm{display:flex;flex-direction:column}
#loginForm input{width:100%;margin-bottom:10px}
.login-actions{display:flex;gap:8px}.login-actions button{flex:1}
#loginMessage,.notice{font-size:13px;color:#fbbf24;margin-top:12px;line-height:1.5}
#appPanel{display:none}.topbar{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.small-btn{background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:8px 10px;font-size:12px}
#status{font-size:12px;color:#94a3b8}
@media(max-width:560px){body{padding:14px 10px}.container{padding:16px}.comic-info{max-width:100%;width:100%}.action-btn{margin-left:auto}}
</style>
</head>
<body>
<section id="loginPanel">
<h2>🔒 Chapter Komik</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Email akun Anda" required autocomplete="username">
<input id="password" type="password" placeholder="Password" required autocomplete="current-password">
<div class="login-actions"><button class="btn-submit" type="submit">Masuk</button></div>
<div id="loginMessage"></div>
</form>
<p class="notice">Masuk menggunakan email dan password yang sudah didaftarkan di Firebase Authentication.</p>
</section>

<div class="container" id="appPanel">
<div class="topbar"><span id="status">Menghubungkan...</span><button class="small-btn" id="exportBtn">Backup JSON</button><button class="small-btn" id="importBtn">Pulihkan JSON</button><button class="small-btn" id="logoutBtn">Keluar</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
<h1>📖 Chapter Komik</h1>
<form id="comicForm">
<input type="text" id="comicTitle" placeholder="Judul Komik Baru..." required>
<input type="number" id="comicChapter" placeholder="Ch" min="1" required>
<select id="comicType"><option value="manhwa">Manhwa</option><option value="manhua">Manhua</option><option value="manga">Manga</option></select>
<button type="submit" class="btn-submit">Tambah</button>
</form>
<div class="category-filter">
<button class="btn-filter active" data-category="semua">Semua</button>
<button class="btn-filter" data-category="manhwa">Manhwa</button>
<button class="btn-filter" data-category="manhua">Manhua</button>
<button class="btn-filter" data-category="manga">Manga</button>
</div>
<div class="search-container"><input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari judul komik di sini..."></div>
<ul id="comicList"></ul>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC--KW_9-AST9TWDyF_zehXk1T2IG2U4tg",
  authDomain: "my-komik-5e1bd.firebaseapp.com",
  projectId: "my-komik-5e1bd",
  storageBucket: "my-komik-5e1bd.firebasestorage.app",
  messagingSenderId: "812144254075",
  appId: "1:812144254075:web:02a13697513172d38dd6de",
  measurementId: "G-KGFQSWT66M"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
const $=id=>document.getElementById(id);
let comics=[], currentCategory='semua', unsubscribe=null, currentUser=null, ready=false;
const loginPanel=$('loginPanel'), appPanel=$('appPanel'), loginMessage=$('loginMessage');

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();loginMessage.textContent='Sedang masuk...';
 try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);}
 catch(err){loginMessage.textContent=translateError(err.code);}
});
function translateError(code){
 const map={'auth/invalid-credential':'Email atau password salah.','auth/user-not-found':'Akun tidak ditemukan.','auth/wrong-password':'Password salah.','auth/invalid-email':'Format email tidak valid.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','auth/network-request-failed':'Koneksi internet bermasalah.'};
 return map[code]||('Gagal masuk: '+code);
}
auth.onAuthStateChanged(async user=>{
 if(unsubscribe){unsubscribe();unsubscribe=null;}
 currentUser=user;ready=false;
 if(!user){loginPanel.style.display='block';appPanel.style.display='none';return;}
 loginPanel.style.display='none';appPanel.style.display='block';$('status').textContent='Memuat data cloud...';
 const ref=db.collection('users').doc(user.uid).collection('comics');
 try{
   const snap=await ref.get();
   if(snap.empty){
     let local=[];
     try{local=JSON.parse(localStorage.getItem('myComicList')||'[]');}catch(e){}
     if(!Array.isArray(local)||!local.length){$('status').textContent='Cloud kosong. Gunakan Pulihkan JSON untuk memasukkan backup.';}
     else{
       const batch=db.batch();
       local.forEach(c=>{const doc=ref.doc();batch.set(doc,{title:String(c.title||''),chapter:Number(c.chapter)||1,type:c.type||'manhwa',lastModified:Number(c.lastModified)||Date.now()});});
       await batch.commit();
       $('status').textContent='Data lokal berhasil dipindahkan ke cloud.';
     }
   }
   unsubscribe=ref.orderBy('lastModified','desc').onSnapshot(s=>{
     comics=s.docs.map(d=>({id:d.id,...d.data()}));
     localStorage.setItem('myComicList',JSON.stringify(comics));
     ready=true;render();$('status').textContent='Tersinkron ke cloud';
   },err=>{$('status').textContent='Gagal memuat cloud: '+err.message;});
 }catch(err){$('status').textContent='Gagal mengakses cloud: '+err.message;}
});
function render(){
 const list=$('comicList');list.innerHTML='';const q=$('searchInput').value.toLowerCase();let count=0;
 comics.forEach((c,i)=>{
  const type=c.type||'manhwa';
  if((currentCategory==='semua'||type===currentCategory)&&String(c.title||'').toLowerCase().includes(q)){
   count++;const li=document.createElement('li');li.className='comic-row';
   const info=document.createElement('div');info.className='comic-info';
   const titleWrap=document.createElement('div');titleWrap.className='title-wrapper';
   const title=document.createElement('span');title.className='comic-title';title.textContent=c.title||'';
   const copy=document.createElement('button');copy.className='btn-copy';copy.textContent='📋 Copy';copy.onclick=()=>navigator.clipboard.writeText(c.title||'').then(()=>{copy.textContent='✅ Copied';setTimeout(()=>copy.textContent='📋 Copy',1500);});
   titleWrap.append(title,copy);
   const meta=document.createElement('div');meta.className='comic-meta';
   const chWrap=document.createElement('div');chWrap.className='chapter-input-container';chWrap.append(document.createTextNode('Chapter '));
   const ch=document.createElement('input');ch.type='number';ch.min='1';ch.value=c.chapter||1;ch.className='input-chapter-inline';ch.onchange=()=>update(i,{chapter:Math.max(1,parseInt(ch.value)||1)});
   chWrap.append(ch);
   const sel=document.createElement('select');sel.className='select-inline';
   ['manhwa','manhua','manga'].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;o.selected=t===type;sel.append(o);});
   sel.onchange=()=>update(i,{type:sel.value});meta.append(chWrap,sel);
   const time=document.createElement('span');time.className='update-time';time.textContent='⏱️ Diperbarui: '+formatTime(c.lastModified);
   info.append(titleWrap,meta,time);
   const actions=document.createElement('div');actions.className='action-btn';
   const plus=action('+','btn-action btn-plus',()=>update(i,{chapter:(Number(c.chapter)||1)+1}));
   const minus=action('-','btn-action btn-minus',()=>update(i,{chapter:Math.max(1,(Number(c.chapter)||1)-1)}));
   const del=action('Hapus','btn-action btn-delete',()=>deleteComic(i));
   actions.append(plus,minus,del);li.append(info,actions);list.append(li);
  }
 });
 if(!count){const li=document.createElement('li');li.className='empty-state';li.textContent='Tidak ada komik dalam kategori atau pencarian ini.';list.append(li);}
}
function action(label,cls,fn){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b;}
function formatTime(ts){if(!ts)return '';return new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(/\./g,':');}
async function update(i,fields){if(!ready||!comics[i])return;const item=comics[i];const updated={...fields,lastModified:Date.now()};try{await db.collection('users').doc(currentUser.uid).collection('comics').doc(item.id).update(updated);}catch(e){alert('Gagal menyimpan perubahan: '+e.message);}}
async function deleteComic(i){if(!ready||!comics[i])return;const c=comics[i];if(confirm(`Hapus "${c.title}" dari daftar?`)){try{await db.collection('users').doc(currentUser.uid).collection('comics').doc(c.id).delete();}catch(e){alert('Gagal menghapus: '+e.message);}}}
$('comicForm').addEventListener('submit',async e=>{e.preventDefault();if(!ready)return alert('Data cloud belum siap.');const title=$('comicTitle').value.trim(),chapter=parseInt($('comicChapter').value),type=$('comicType').value;if(!title||!chapter)return;try{await db.collection('users').doc(currentUser.uid).collection('comics').add({title,chapter,type,lastModified:Date.now()});$('comicForm').reset();}catch(err){alert('Gagal menambah komik: '+err.message);}});
document.querySelectorAll('.btn-filter').forEach(b=>b.onclick=()=>{currentCategory=b.dataset.category;document.querySelectorAll('.btn-filter').forEach(x=>x.classList.toggle('active',x===b));render();});
$('searchInput').addEventListener('input',render);
$('logoutBtn').onclick=()=>auth.signOut();
$('exportBtn').onclick=()=>{const data={tanggal_backup:new Date().toISOString(),localStorage:{myComicList:JSON.stringify(comics)}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Backup_Komik_Pribadi.json';a.click();URL.revokeObjectURL(a.href);};
$('importBtn').onclick=()=>{if(!ready)return alert('Tunggu sampai cloud siap.');$('importFile').click();};
$('importFile').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());let raw=data.localStorage?.myComicList;
  const arr=typeof raw==='string'?JSON.parse(raw):(Array.isArray(raw)?raw:data.comics);
  if(!Array.isArray(arr))throw new Error('Format backup tidak dikenali.');
  if(!confirm(`Pulihkan ${arr.length} komik ke cloud? Data cloud yang ada akan diganti.`))return;
  const col=db.collection('users').doc(currentUser.uid).collection('comics');const old=await col.get();let batch=db.batch(),ops=0;
  old.docs.forEach(d=>{batch.delete(d.ref);ops++;});
  for(const c of arr){const doc=col.doc();batch.set(doc,{title:String(c.title||''),chapter:Number(c.chapter)||1,type:c.type||'manhwa',lastModified:Number(c.lastModified)||Date.now()});ops++;if(ops>=450){await batch.commit();batch=db.batch();ops=0;}}
  if(ops)await batch.commit();alert('Backup berhasil dipulihkan ke cloud.');
 }catch(err){alert('Gagal memulihkan backup: '+err.message);}finally{e.target.value='';}
});
</script>
</body>
</html>
