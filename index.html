<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengingat Chapter Komik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('anime-moon-landscape.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #e2e8f0; 
            padding: 30px 20px; 
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.75);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #f8fafc;
            font-size: 24px;
            font-weight: 600;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
        }
        button {
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .comic-list {
            list-style: none;
        }
        .comic-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .comic-info {
            flex: 1;
            margin-right: 15px;
        }
        .comic-title {
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .comic-chapter {
            font-size: 14px;
            color: #94a3b8;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .btn-ch {
            padding: 6px 12px;
            font-size: 14px;
            background: #475569;
            border-radius: 6px;
        }
        .btn-ch:hover {
            background: #64748b;
        }
        .btn-del {
            padding: 6px 12px;
            font-size: 14px;
            background: #ef4444;
            border-radius: 6px;
        }
        .btn-del:hover {
            background: #dc2626;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pengingat Chapter Komik</h1>
        
        <div class="form-group">
            <input type="text" id="comicInput" placeholder="Masukkan nama komik baru...">
            <button onclick="addComic()">Tambah</button>
        </div>

        <ul id="comicList" class="comic-list"></ul>
    </div>

    <script>
        let comics = JSON.parse(localStorage.getItem('savedComics')) || [];

        function saveToStorage() {
            localStorage.setItem('savedComics', JSON.stringify(comics));
        }

        function renderComics() {
            const listElement = document.getElementById('comicList');
            listElement.innerHTML = '';

            if (comics.length === 0) {
                listElement.innerHTML = '<li class="empty-state">Belum ada komik yang ditambahkan.</li>';
                return;
            }

            comics.forEach((comic, index) => {
                const li = document.createElement('li');
                li.className = 'comic-item';
                li.innerHTML = `
                    <div class="comic-info">
                        <div class="comic-title">${comic.title}</div>
                        <div class="comic-chapter">Chapter Terakhir: ${comic.chapter}</div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-ch" onclick="updateChapter(${index}, -1)">-</button>
                        <button class="btn-ch" onclick="updateChapter(${index}, 1)">+</button>
                        <button class="btn-del" onclick="deleteComic(${index})">Hapus</button>
                    </div>
                `;
                listElement.appendChild(li);
            });
        }

        function addComic() {
            const input = document.getElementById('comicInput');
            const title = input.value.trim();

            if (title === '') {
                alert('Nama komik tidak boleh kosong!');
                return;
            }

            comics.push({
                title: title,
                chapter: 1
            });

            input.value = '';
            saveToStorage();
            renderComics();
        }

        function updateChapter(index, change) {
            comics[index].chapter += change;
            if (comics[index].chapter < 1) {
                comics[index].chapter = 1;
            }
            saveToStorage();
            renderComics();
        }

        function deleteComic(index) {
            if (confirm(`Apakah Anda yakin ingin menghapus "${comics[index].title}"?`)) {
                comics.splice(index, 1);
                saveToStorage();
                renderComics();
            }
        }

        // Jalankan fungsi tampilkan data saat pertama kali web dibuka
        renderComics();
    </script>
</body>
</html>
